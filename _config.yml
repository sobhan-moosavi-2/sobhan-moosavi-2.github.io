# Site settings
title: "Sobhan Moosavi"
url: "https://smoosavi.org"
baseurl: ""

# No theme - pure static HTML
# github-pages will still serve index.html directly

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - talkmap.ipynb
  - talkmap.py
  - markdown_generator
  - _publications
  - _projects
  - _posts
  - _layouts
  - _includes
  - _sass
  - _datasets
  - _pages
  - _data
